name: Release macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SPARKBAR_VERSION: 0.1.${{ github.run_number }}
      SPARKBAR_BUILD: ${{ github.run_number }}
      MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED || 'false' }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run tests
        run: swift test

      - name: Build packaged app
        run: ./scripts/build-app.sh

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"

          keychain_path="$RUNNER_TEMP/sparkbar-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_password=$(openssl rand -hex 24)
          echo "SPARKBAR_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "SPARKBAR_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$MACOS_SIGNING_IDENTITY"

      - name: Prepare App Store Connect notarization key
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_PRIVATE_KEY_BASE64"

          private_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$private_key_path"
          chmod 600 "$private_key_path"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_PRIVATE_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"

      - name: Sign, notarize, and staple app
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          scripts/sign-and-notarize.sh \
            .build/Release/SparkBar.app \
            "dist/SparkBar-${SPARKBAR_VERSION}-macOS.zip"

      - name: Sign app ad hoc
        if: ${{ env.MACOS_SIGNING_ENABLED != 'true' }}
        run: |
          set -euo pipefail
          app=".build/Release/SparkBar.app"
          archive="dist/SparkBar-${SPARKBAR_VERSION}-macOS.zip"
          mkdir -p dist
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"

      - name: Validate release metadata
        run: |
          set -euo pipefail
          app=".build/Release/SparkBar.app"
          archive="dist/SparkBar-${SPARKBAR_VERSION}-macOS.zip"
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          bundle_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          test "$bundle_version" = "$SPARKBAR_VERSION"
          test "$bundle_build" = "$SPARKBAR_BUILD"
          test -f "$archive"
          shasum -a 256 "$archive" > dist/SHA256SUMS

          if [ "$MACOS_SIGNING_ENABLED" = "true" ]; then
            release_mode="Developer ID signed and notarized"
          else
            release_mode="ad-hoc signed (not notarized)"
          fi

          cat > dist/RELEASE_NOTES.md <<EOF
          ## SparkBar ${SPARKBAR_VERSION}

          Automated macOS build for commit ${GITHUB_SHA}.

          Distribution mode: ${release_mode}.
          Verify the download with the accompanying SHA-256 checksum.
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SparkBar-${{ env.SPARKBAR_VERSION }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${SPARKBAR_VERSION}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SparkBar ${SPARKBAR_VERSION}" \
            --notes-file dist/RELEASE_NOTES.md \
            --latest \
            "dist/SparkBar-${SPARKBAR_VERSION}-macOS.zip" \
            dist/SHA256SUMS

      - name: Clean up signing credentials
        if: ${{ always() && env.MACOS_SIGNING_ENABLED == 'true' }}
        run: |
          set +e
          if [ -n "${SPARKBAR_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SPARKBAR_SIGNING_KEYCHAIN"
          fi
          if [ -n "${SPARKBAR_CERTIFICATE_PATH:-}" ]; then
            rm -f "$SPARKBAR_CERTIFICATE_PATH"
          fi
          if [ -n "${APPLE_API_PRIVATE_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_PRIVATE_KEY_PATH"
          fi
