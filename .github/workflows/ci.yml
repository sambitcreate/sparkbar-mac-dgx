name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build packaged app
        run: ./scripts/build-app.sh

      - name: Validate packaged app
        run: |
          set -euo pipefail
          app=".build/Release/SparkBar.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/SparkBar"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
