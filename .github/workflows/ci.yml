name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs so the required "CI / Verify" check is reported on every push/PR.
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: detect
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a crafted value can never be executed as shell.
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="$BASE_SHA"
          fi
          case "$base" in
            "" | 0000000000000000000000000000000000000000)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # A force-push can leave the previous tip unreachable, and `git diff`
          # then exits non-zero and fails the required check with no code
          # problem to fix. Treat an unknown base as "not docs-only".
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base '$base' is not present locally; assuming a code change" >&2
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          non_docs=$(printf '%s\n' "$changed" | grep -Ev '\.md$' || true)
          if [ -n "$non_docs" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Changed files: %s\n' "$(printf '%s\n' "$changed" | tr '\n' ' ')"

  # Skipped (reported as Success) when only .md files changed.
  verify:
    name: Verify
    needs: detect
    if: needs.detect.outputs.docs-only == 'false'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build packaged app
        run: ./scripts/build-app.sh

      - name: Validate packaged app
        run: |
          set -euo pipefail
          app=".build/Release/SparkBar.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/SparkBar"
          # --deep is for verification, not signing: it would silently mis-sign
          # any nested content once a helper or framework is added.
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
